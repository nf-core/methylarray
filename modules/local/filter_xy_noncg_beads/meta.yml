name: filter_xy_noncg_beads
description: Apply independent probe-level filters to the normalised beta matrix, removing sex chromosome probes, non-CpG probes, and probes with insufficient bead counts, as controlled by pipeline parameters.
keywords:
  - methylation
  - epigenetics
  - array
  - filtering
  - probes
  - beads
  - sex chromosomes
  - minfi
input:
  - - name: rg_rds
      type: file
      description: Filtered RGChannelSet object serialised as RDS (used for bead-count information).
      pattern: "*.rds"
  - - name: beta_norm_rds
      type: file
      description: Normalised beta-value matrix serialised as RDS.
      pattern: "*.rds"
output:
  - - name: beta3_rds
      type: file
      description: Filtered beta-value matrix after applying all probe filters, serialised as RDS.
      pattern: "beta3.rds"
  - - name: filtering_summary_tsv
      type: file
      description: TSV summarising the number of probes removed at each filtering step.
      pattern: "filtering_summary.tsv"
  - - name: versions
      type: file
      description: File containing software versions.
      pattern: "versions.yml"
authors:
  - "@nf-core"
maintainers:
  - "@nf-core"
args_id: "$args"
